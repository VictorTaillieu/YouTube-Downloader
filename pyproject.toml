[project]
name = "ytdownloader"
version = "2.0.0.dev0"
description = "Simple desktop GUI around yt-dlp to download YouTube videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
]

[project.scripts]
ytdownloader = "ytdownloader.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdownloader"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Legacy Tkinter script, removed in iteration 2.
extend-exclude = ["ytdownload.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
